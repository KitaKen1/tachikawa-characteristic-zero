name = "tachikawaCharZero"
version = "0.1.0"
defaultTargets = ["Tachikawa"]

[[lean_lib]]
name = "Tachikawa"

[[lean_lib]]
name = "TachikawaCharZero"
roots = ["TachikawaCharZero.ArtinWitness"]
globs = ["TachikawaCharZero.+"]

[[lean_lib]]
name = "OAISupport"
srcDir = "vendor/openai-math/lean"
roots = ["OAI.Algebra.AuslanderReiten.Algebras.BaseAlgebra", "OAI.RingTheory.Tachikawa.Coresolution"]
globs = ["OAI.Algebra.AuslanderReiten.Algebras.BaseAlgebra", "OAI.RingTheory.Tachikawa.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"
